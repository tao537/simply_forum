<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>简易论坛</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f0f2f5; color: #1f2937; padding: 24px; }
  .container { max-width: 860px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; }
  h1 a { color: inherit; text-decoration: none; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; }
  .toolbar input { flex: 1; padding: 10px 14px; border: 1px solid #e5e7eb;
                   border-radius: 8px; font-size: 14px; outline: none; }
  .toolbar input:focus { border-color: #3b82f6; }
  .btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer;
         font-size: 14px; font-weight: 500; transition: .15s; }
  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-primary:hover { background: #2563eb; }
  .btn-ghost { background: #fff; color: #1f2937; border: 1px solid #e5e7eb; }
  .btn-ghost:hover { background: #f3f4f6; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  .post { background: #fff; border-radius: 12px; padding: 18px 22px;
          margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.04);
          cursor: pointer; transition: .15s; }
  .post:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); transform: translateY(-1px); }
  .post-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; color: #111827; }
  .post-title:hover { color: #3b82f6; }
  .post-summary { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 10px;
                  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                  overflow: hidden; }
  .post-meta { display: flex; gap: 18px; font-size: 12px; color: #9ca3af; }
  .post-meta span { display: inline-flex; align-items: center; gap: 4px; }

  .empty { text-align: center; padding: 60px 20px; color: #9ca3af;
           background: #fff; border-radius: 12px; }
  .pager { display: flex; justify-content: space-between; align-items: center;
           margin-top: 16px; font-size: 14px; color: #6b7280; }
  .pager .pages { display: flex; gap: 6px; align-items: center; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4);
             display: none; align-items: center; justify-content: center; z-index: 10;
             padding: 20px; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 560px;
           padding: 26px; box-shadow: 0 20px 60px rgba(0,0,0,.2);
           max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 18px; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 6px; }
  .field input, .field textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb;
    border-radius: 8px; font-size: 14px; outline: none;
    font-family: inherit; resize: vertical;
  }
  .field input:focus, .field textarea:focus { border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
  .field textarea { min-height: 140px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

  #toast { position: fixed; bottom: 24px; left: 50%;
           transform: translateX(-50%) translateY(80px);
           background: #111827; color: #fff; padding: 10px 20px; border-radius: 8px;
           font-size: 14px; opacity: 0; transition: .3s; pointer-events: none; z-index: 20; }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.err { background: #ef4444; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><a href="/">📋 简易论坛</a></h1>
  </header>

  <div class="toolbar">
    <input id="kw" type="text" placeholder="搜索标题或内容…" />
    <button class="btn btn-ghost" onclick="load(1)">搜索</button>
    <button class="btn btn-primary" onclick="openCreate()">✏️ 发帖</button>
  </div>

  <div id="list"></div>

  <div class="pager" id="pager" style="display:none">
    <span id="pagerInfo"></span>
    <div class="pages">
      <button class="btn btn-ghost btn-sm" id="prevBtn" onclick="load(state.page-1)">上一页</button>
      <span id="pageNow"></span>
      <button class="btn btn-ghost btn-sm" id="nextBtn" onclick="load(state.page+1)">下一页</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">发布新帖</h2>
    <div class="field">
      <label>昵称（可留空）</label>
      <input id="f-author" type="text" placeholder="匿名" maxlength="30" />
    </div>
    <div class="field">
      <label>标题 *</label>
      <input id="f-title" type="text" placeholder="一句话说清主题" maxlength="100" />
    </div>
    <div class="field">
      <label>内容 *</label>
      <textarea id="f-content" placeholder="详细说说…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitPost()">发布</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = '/api/posts';
const state = { page: 1, size: 10, keyword: '', total: 0 };

async function request(url, opts = {}) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.message || `HTTP ${res.status}`);
    err.details = data.errors || null;
    throw err;
  }
  return data;
}

function toast(msg, isErr = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = isErr ? 'show err' : 'show';
  clearTimeout(el._t);
  el._t = setTimeout(() => (el.className = ''), 2400);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function load(page = 1) {
  state.page = Math.max(1, page);
  state.keyword = document.getElementById('kw').value.trim();
  const qs = new URLSearchParams({ page: state.page, size: state.size, keyword: state.keyword });
  try {
    const data = await request(`${API}?${qs}`);
    state.total = data.total;
    render(data.rows);
    renderPager();
  } catch (e) { toast(e.message, true); }
}

function render(rows) {
  const box = document.getElementById('list');
  if (!rows.length) {
    box.innerHTML = `<div class="empty">还没有帖子，点击「发帖」发第一条吧 ✨</div>`;
    document.getElementById('pager').style.display = 'none';
    return;
  }
  document.getElementById('pager').style.display = 'flex';
  box.innerHTML = rows.map(p => `
    <div class="post" onclick="location.href='/post.html?id=${p.id}'">
      <div class="post-title">${escapeHtml(p.title)}</div>
      <div class="post-summary">${escapeHtml(p.summary || '')}</div>
      <div class="post-meta">
        <span>👤 ${escapeHtml(p.author_name)}</span>
        <span>💬 ${p.comment_count}</span>
        <span>👁 ${p.views}</span>
        <span>🕒 ${p.created_at}</span>
      </div>
    </div>
  `).join('');
}

function renderPager() {
  const totalPages = Math.max(1, Math.ceil(state.total / state.size));
  document.getElementById('pagerInfo').textContent = `共 ${state.total} 条`;
  document.getElementById('pageNow').textContent = `${state.page} / ${totalPages}`;
  document.getElementById('prevBtn').disabled = state.page <= 1;
  document.getElementById('nextBtn').disabled = state.page >= totalPages;
}

function openCreate() {
  ['f-author', 'f-title', 'f-content'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('f-title').focus();
}

function closeModal() {
  document.getElementById('overlay').classList.remove('show');
}

async function submitPost() {
  const payload = {
    title: document.getElementById('f-title').value.trim(),
    content: document.getElementById('f-content').value.trim(),
  };
  const author = document.getElementById('f-author').value.trim();
  if (author) payload.author_name = author;

  if (!payload.title || !payload.content) {
    return toast('标题和内容必填', true);
  }
  try {
    const post = await request(API, { method: 'POST', body: JSON.stringify(payload) });
    toast('发布成功');
    closeModal();
    location.href = `/post.html?id=${post.id}`;
  } catch (e) { toast(e.message, true); }
}

document.getElementById('kw').addEventListener('keydown', e => {
  if (e.key === 'Enter') load(1);
});
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') closeModal();
});

load(1);
</script>
</body>
</html>
